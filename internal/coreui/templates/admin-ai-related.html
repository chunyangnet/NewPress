{{define "content"}}<section class="admin-page"><header class="admin-page-heading"><div><h1>管理相关话题</h1><p>{{.Post.Title}}</p></div><a class="admin-button admin-button-quiet" href="/admin/content/{{.Post.ID}}/edit/">返回文章</a></header>
  {{if .FeatureStatus}}{{template "admin-feature-status" .}}{{end}}{{range .RelatedTopics}}<form method="post" class="admin-panel"><input type="hidden" name="csrf_token" value="{{$.Admin.CSRFToken}}"><input type="hidden" name="version" value="{{$.Post.Version}}"><input type="hidden" name="id" value="{{.ID}}"><label>话题标题<input name="title" maxlength="200" required value="{{.Title}}"></label><label>正文<textarea name="body" rows="6" maxlength="5000" required>{{.Body}}</textarea></label>{{if not $.Admin.ReadOnly}}<button class="admin-button admin-button-primary" name="action" value="save">保存话题</button><button class="admin-button admin-button-quiet" name="action" value="remove" formnovalidate>删除话题</button>{{end}}</form>{{end}}{{if not .Admin.ReadOnly}}<details class="admin-panel"><summary>添加话题</summary><form method="post" class="admin-panel"><input type="hidden" name="csrf_token" value="{{$.Admin.CSRFToken}}"><input type="hidden" name="version" value="{{$.Post.Version}}"><input type="hidden" name="id" value=""><label>话题标题<input name="title" maxlength="200" required value=""></label><label>正文<textarea name="body" rows="6" maxlength="5000" required></textarea></label>{{if not $.Admin.ReadOnly}}<button class="admin-button admin-button-primary" name="action" value="save">添加话题</button>{{end}}</form></details>{{end}}</section>{{end}}
