name: newpress

services:
  db:
    image: ${NEWPRESS_POSTGRES_PATCHED_IMAGE:-newpress-postgres:local}
    build:
      context: ./deploy
      dockerfile: Dockerfile.postgres
      args:
        BASE_IMAGE: ${NEWPRESS_POSTGRES_IMAGE:-postgres:18.7-bookworm@sha256:e742a2668255221388004f3a42b6150a2103f5054ab3a4a93ae9e4f01e551c35}
    restart: unless-stopped
    environment:
      POSTGRES_DB: newpress
      POSTGRES_USER: newpress
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newpress -d newpress"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
    shm_size: 256m
    mem_limit: 2g
    mem_reservation: 768m
    cpus: 1.25
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: &local_logging
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  migrate:
    image: ${NEWPRESS_IMAGE:-newpress:local}
    build:
      context: .
      args:
        VERSION: ${NEWPRESS_VERSION:-1.0.0-beta.2}
        COMMIT: ${NEWPRESS_COMMIT:-local}
        BUILD_DATE: ${NEWPRESS_BUILD_DATE:-unknown}
        NEWPRESS_GO_IMAGE: ${NEWPRESS_GO_IMAGE:-golang:1.26.11-bookworm@sha256:ea47ee45f1284d60f9cc09cb2c3bb4f508c256b640bd8bb30342ff13d1adcb52}
        NEWPRESS_RUNTIME_IMAGE: ${NEWPRESS_RUNTIME_IMAGE:-gcr.io/distroless/static-debian13:nonroot@sha256:f7f8f729987ad0fdf6b05eeeae94b26e6a0f613bdf46feea7fc40f7bd72953e6}
        GOPROXY: ${NEWPRESS_GOPROXY:-https://proxy.golang.org}
        GOSUMDB: ${NEWPRESS_GOSUMDB:-sum.golang.org}
    command: ["migrate", "up"]
    restart: "no"
    environment: &app_environment
      NEWPRESS_DATABASE_URL_FILE: /run/secrets/database_url
      NEWPRESS_DB_MAX_CONNS: ${NEWPRESS_DB_MAX_CONNS:-16}
      NEWPRESS_DB_MIN_CONNS: ${NEWPRESS_DB_MIN_CONNS:-1}
      NEWPRESS_DATA_DIR: /app/var
      NEWPRESS_THEMES_DIR: /app/themes
      NEWPRESS_PLUGINS_DIR: /app/plugins
      NEWPRESS_PLUGIN_WEBHOOKS_ENABLED: ${NEWPRESS_PLUGIN_WEBHOOKS_ENABLED:-false}
      NEWPRESS_COMMUNITY_ENABLED: ${NEWPRESS_COMMUNITY_ENABLED:-false}
      NEWPRESS_OFFICIAL_PLUGIN_CATALOGS: ${NEWPRESS_OFFICIAL_PLUGIN_CATALOGS:-}
      NEWPRESS_OFFICIAL_PLUGIN_PUBLIC_KEY: ${NEWPRESS_OFFICIAL_PLUGIN_PUBLIC_KEY:-}
      # Unset values stay absent so the built-in theme source remains enabled.
      NEWPRESS_OFFICIAL_THEME_CATALOGS:
      NEWPRESS_OFFICIAL_THEME_PUBLIC_KEY:
      NEWPRESS_ACTIVE_THEME: chunnel
      NEWPRESS_AUTO_MIGRATE: "false"
      NEWPRESS_SEED_DEMO: ${NEWPRESS_SEED_DEMO:-false}
      NEWPRESS_ANALYTICS_ENABLED: ${NEWPRESS_ANALYTICS_ENABLED:-true}
      NEWPRESS_PUBLIC_URL: ${NEWPRESS_PUBLIC_URL:-http://localhost:8080}
      # Only used to initialize site settings on the first start.
      NEWPRESS_SITE_TITLE: ${NEWPRESS_SITE_TITLE:-NewPress}
      NEWPRESS_SITE_TAGLINE: ${NEWPRESS_SITE_TAGLINE:-文章、资源与社区}
      NEWPRESS_TRUSTED_PROXY_CIDRS: ${NEWPRESS_TRUSTED_PROXY_CIDRS-172.30.0.2/32}
      NEWPRESS_CDN_CLOUDFLARE_CIDRS: ${NEWPRESS_CDN_CLOUDFLARE_CIDRS:-}
      NEWPRESS_CDN_ESA_CIDRS: ${NEWPRESS_CDN_ESA_CIDRS:-}
      NEWPRESS_CDN_EDGEONE_CIDRS: ${NEWPRESS_CDN_EDGEONE_CIDRS:-}
      NEWPRESS_CDN_CLOUDFLARE_ORIGIN_TOKEN: ${NEWPRESS_CDN_CLOUDFLARE_ORIGIN_TOKEN:-}
      NEWPRESS_CDN_ESA_ORIGIN_TOKEN: ${NEWPRESS_CDN_ESA_ORIGIN_TOKEN:-}
      NEWPRESS_CDN_EDGEONE_ORIGIN_TOKEN: ${NEWPRESS_CDN_EDGEONE_ORIGIN_TOKEN:-}
      GOMEMLIMIT: 460MiB
    secrets:
      - database_url
    volumes: &app_volumes
      - newpress_data:/app/var
      - newpress_themes:/app/themes
      - newpress_plugins:/app/plugins
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: *local_logging

  app:
    image: ${NEWPRESS_IMAGE:-newpress:local}
    command: ["run"]
    restart: unless-stopped
    environment:
      <<: *app_environment
      NEWPRESS_ADDR: :8080
      NEWPRESS_CONTAINER: "true"
      NEWPRESS_UPDATE_DIR: /app/updates
      NEWPRESS_UPDATE_PUBLIC_KEY: ${NEWPRESS_UPDATE_PUBLIC_KEY:-}
      NEWPRESS_UPDATE_CHECK_INTERVAL: ${NEWPRESS_UPDATE_CHECK_INTERVAL:-6h}
      NEWPRESS_UPDATE_OBSERVE_FOR: ${NEWPRESS_UPDATE_OBSERVE_FOR:-2m}
      NEWPRESS_SEED_DEMO: "false"
      NEWPRESS_ADMIN_USERNAME: ${NEWPRESS_ADMIN_USERNAME:-admin}
      NEWPRESS_ADMIN_EMAIL: ${NEWPRESS_ADMIN_EMAIL:-admin@localhost.invalid}
      NEWPRESS_ADMIN_DISPLAY_NAME: ${NEWPRESS_ADMIN_DISPLAY_NAME:-站点管理员}
      NEWPRESS_ADMIN_LOCALE: ${NEWPRESS_ADMIN_LOCALE:-zh-CN}
      NEWPRESS_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      NEWPRESS_ADMIN_SESSION_TTL: ${NEWPRESS_ADMIN_SESSION_TTL:-12h}
      NEWPRESS_ADMIN_IDLE_TTL: ${NEWPRESS_ADMIN_IDLE_TTL:-30m}
      NEWPRESS_MAX_UPLOAD_BYTES: ${NEWPRESS_MAX_UPLOAD_BYTES:-67108864}
    secrets:
      - database_url
      - admin_password_hash
    volumes:
      - newpress_data:/app/var
      - newpress_themes:/app/themes
      - newpress_plugins:/app/plugins
      - newpress_updates:/app/updates
    networks:
      edge:
      data:
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/newpress", "healthcheck", "--ready"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    logging: *local_logging

  proxy:
    image: ${NEWPRESS_PROXY_PATCHED_IMAGE:-newpress-nginx:local}
    build:
      context: ./deploy
      dockerfile: Dockerfile.nginx
      args:
        BASE_IMAGE: ${NEWPRESS_PROXY_IMAGE:-nginx:1.30.8-alpine3.24-slim@sha256:e9eaa7298465eab06d618c51556fdcf3fb5061f9ff40bd28ee898fbd7ee7f900}
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    ports:
      - "${NEWPRESS_HTTP_BIND:-0.0.0.0}:${NEWPRESS_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ${NEWPRESS_NGINX_CONFIG:-./deploy/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    networks:
      edge:
        ipv4_address: ${NEWPRESS_PROXY_IPV4:-172.30.0.2}
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    logging: *local_logging

networks:
  edge:
    ipam:
      config:
        - subnet: ${NEWPRESS_EDGE_SUBNET:-172.30.0.0/24}
  data:
    internal: true

volumes:
  postgres_data:
  newpress_data:
  newpress_themes:
  newpress_plugins:
  newpress_updates:

secrets:
  postgres_password:
    file: ${NEWPRESS_SECRETS_DIR:-./.secrets}/postgres_password
  database_url:
    file: ${NEWPRESS_SECRETS_DIR:-./.secrets}/database_url
  admin_password_hash:
    file: ${NEWPRESS_SECRETS_DIR:-./.secrets}/admin_password_hash
