{{define "search-dialog"}}
<dialog class="search-dialog" id="site-search" aria-labelledby="search-title">
    <div class="search-dialog-inner"><button class="icon-button search-close" type="button" data-search-close aria-label="关闭搜索">{{template "icon-close" .}}</button>
      <h2 id="search-title">搜索新闻与文章</h2>
      <form action="/explore/" method="get" role="search"><label class="sr-only" for="overlay-query">搜索新闻与文章</label><input id="overlay-query" name="q" type="search" maxlength="80" value="{{.SearchQuery}}" placeholder="搜索新闻与文章" required><button class="icon-button" type="submit" aria-label="提交搜索">{{template "icon-search" .}}</button></form>
    </div>
  </dialog>
{{end}}
