{{define "pagination"}}{{if gt .Pagination.Pages 1}}<nav class="pagination" aria-label="内容分页">{{if .Pagination.HasPrevious}}<a class="button button-secondary" rel="prev" href="{{.Pagination.PreviousURL}}">上一页</a>{{end}}<span aria-current="page">第 {{.Pagination.Page}} / {{.Pagination.Pages}} 页</span>{{if .Pagination.HasNext}}<a class="button button-secondary" rel="next" href="{{.Pagination.NextURL}}">下一页 {{template "icon" "arrow"}}</a>{{end}}</nav>{{end}}{{end}}
