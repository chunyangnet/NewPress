name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-bookworm@sha256:e742a2668255221388004f3a42b6150a2103f5054ab3a4a93ae9e4f01e551c35
        env:
          POSTGRES_DB: newpress_test
          POSTGRES_USER: newpress
          POSTGRES_PASSWORD: newpress-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newpress -d newpress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate unprivileged proxy configuration
        run: |
          image=$(sed -n 's/.*NEWPRESS_PROXY_IMAGE:-\([^}]*\)}.*/\1/p' compose.yaml)
          test -n "$image"
          docker build --pull --no-cache --build-arg BASE_IMAGE="$image" -f deploy/Dockerfile.nginx -t newpress-nginx:ci deploy
          image=newpress-nginx:ci
          docker run --rm --read-only --user 101:101 --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=32m,mode=1777 --add-host app:127.0.0.1 \
            -v "$PWD/deploy/nginx-main.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            --entrypoint nginx "$image" -t
      - name: Build patched database and cache images
        run: |
          docker build --pull --no-cache -f deploy/Dockerfile.postgres -t newpress-postgres:ci deploy
          docker build --pull --no-cache -f deploy/Dockerfile.redis -t newpress-redis:ci deploy
          docker run --rm --entrypoint postgres newpress-postgres:ci --version
          docker run --rm --entrypoint redis-server newpress-redis:ci --version
      - name: Update CI database service PAM packages
        env:
          DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec --user 0 "$DATABASE_CONTAINER" sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends --only-upgrade libpam0g libpam-modules libpam-modules-bin libpam-runtime
            for package in libpam0g libpam-modules libpam-modules-bin libpam-runtime; do
              dpkg --compare-versions "$(dpkg-query -W -f="\${Version}" "$package")" ge "1.5.2-6+deb12u3"
            done
            rm -rf /var/lib/apt/lists/*
          '
      - name: Public source boundary
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_public_source.py' -v
          python3 scripts/check_public_source.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Frontend dependency vulnerability scan
        run: npm audit --ignore-scripts --registry=https://registry.npmjs.org
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Allow sandboxed Chromium on AppArmor hosts
        # Only the CI-installed browsers need permission to create the user
        # namespaces used by Chromium's sandbox on recent Ubuntu runners.
        run: |
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo tee /etc/apparmor.d/newpress-playwright > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile newpress-playwright $HOME/.cache/ms-playwright/**/chrome{,-headless-shell} flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/newpress-playwright
          fi
      - name: Frontend regression tests
        run: |
          npm run typecheck:frontend
          npm run check:frontend
          npm run test:frontend
      - name: Screenshot network isolation
        run: npm run test:security:browser
      - name: Independent theme contracts
        run: |
          npm run build:theme -- --source themes/starter --check
          npm run check:theme -- --source themes/starter
      - name: Deployment script checks
        run: |
          bash -n install.sh
          bash -n scripts/deploy.sh
          bash -n scripts/bootstrap-python.sh
          python3 -m unittest discover -s scripts -p 'test_deploy*.py' -v
          python3 -m unittest discover -s scripts -p 'test_install*.py' -v
          python3 -m unittest discover -s scripts -p 'test_build_update.py' -v
      - name: Licenses and format
        # Licensing is checked before compilation so standalone executables and
        # immutable OTA archives always carry the current dependency notices.
        run: |
          go mod download all
          python3 scripts/collect_licenses.py --check
          python3 -m unittest discover -s scripts -p 'test_build_extension.py' -v
          unformatted="$(gofmt -l .)"
          if test -n "$unformatted"; then
            printf 'Run gofmt on the following files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        env:
          NEWPRESS_TEST_DATABASE_URL: postgres://newpress:newpress-ci-password@127.0.0.1:5432/newpress_test?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Public request URL fuzz smoke
        run: go test ./internal/safehttp -run '^$' -fuzz '^FuzzPublicURLBoundary$' -fuzztime=10s -parallel=2
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false ./cmd/newpress

  core-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate the deployment with the optional OTA secrets
        run: |
          docker compose -f compose.yaml -f deploy/compose.update-recovery.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose.updates-secret.yaml config --quiet
      - name: Build the production image and run signed core OTA
        run: |
          if ! pg_bin="$(pg_config --bindir)" || ! test -x "$pg_bin/initdb"; then
            sudo apt-get update
            sudo apt-get install -y postgresql postgresql-client libpq-dev
            pg_bin="$(pg_config --bindir)"
          fi
          test -x "$pg_bin/pg_restore"
          go mod download all
          docker build -t newpress:ota-ci .
          python3 scripts/test_core_release_smoke.py --pg-bin "$pg_bin" --docker-image newpress:ota-ci
