services:
  redis:
    image: redis:8.10.0-alpine3.23@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    profiles: ["cache"]
    restart: unless-stopped
    command: ["redis-server", "--aclfile", "/run/secrets/redis_acl", "--protected-mode", "yes", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lfu"]
    secrets:
      - redis_acl
    networks:
      - data
    expose:
      - "6379"
    read_only: true
    tmpfs:
      - /data:size=32m,mode=0750
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64

secrets:
  redis_acl:
    file: ${NEWPRESS_SECRETS_DIR:-./.secrets}/redis_acl
