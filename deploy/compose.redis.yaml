services:
  redis:
    image: ${NEWPRESS_REDIS_PATCHED_IMAGE:-newpress-redis:local}
    build:
      context: ./deploy
      dockerfile: Dockerfile.redis
      args:
        BASE_IMAGE: ${NEWPRESS_REDIS_IMAGE:-redis:8.10.3-alpine3.23@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3}
    profiles: ["cache"]
    restart: unless-stopped
    command: ["redis-server", "--aclfile", "/run/secrets/redis_acl", "--protected-mode", "yes", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lfu"]
    secrets:
      - redis_acl
    networks:
      - data
    expose:
      - "6379"
    read_only: true
    tmpfs:
      - /data:size=32m,mode=0750
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64

secrets:
  redis_acl:
    file: ${NEWPRESS_SECRETS_DIR:-./.secrets}/redis_acl
