# Optional: docker compose -f compose.yaml -f deploy/compose.updates-secret.yaml up -d
# Prepare the token and the operator-owned update-recovery directory before enabling.
services:
  app:
    environment:
      NEWPRESS_GITEE_TOKEN_FILE: /run/secrets/gitee_token
      NEWPRESS_UPDATE_BACKUP_RECEIPT_FILE: /run/update-recovery/backup.json
    volumes:
      - type: bind
        source: ${NEWPRESS_SECRETS_DIR:-./.secrets}/update-recovery
        target: /run/update-recovery
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - database_url
      - admin_password_hash
      - gitee_token

secrets:
  gitee_token:
    file: ${NEWPRESS_SECRETS_DIR:-./.secrets}/gitee_token
